name: Validate resources
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate legacy resource catalog
        run: python scripts/validate_catalog.py
      - name: Validate research taxonomy and paths
        run: python scripts/validate_research_taxonomy.py
      - name: Smoke test paper discovery
        run: python -m unittest discover -s scripts -p 'test_paper_discovery.py'
