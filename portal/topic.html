<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究专题 · Awesome Sound Detection</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#17263a;background:#f4f7fb;--panel:#fff;--ink:#17263a;--muted:#63758b;--line:#dce5ef;--blue:#185aa9;--cyan:#0b8793;--soft:#eaf3ff;--warm:#fff4df;--shadow:0 12px 34px #17365b10} @media(prefers-color-scheme:dark){:root{color:#eaf0f8;background:#0d1522;--panel:#172438;--ink:#eaf0f8;--muted:#afbed1;--line:#34465e;--blue:#91bfff;--cyan:#65d5db;--soft:#203a58;--warm:#453b28;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:var(--blue)}button,input,select{font:inherit}.wrap{max-width:1320px;margin:auto;padding:18px 24px 72px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}.topnav{display:flex;gap:16px}.hero{margin:22px 0 16px;padding:34px;border-radius:24px;background:linear-gradient(125deg,#0e345d,#176a91 72%,#168b8d);color:#fff;box-shadow:var(--shadow)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.74}.hero h1{font-size:clamp(29px,4vw,46px);margin:8px 0}.hero p{max-width:860px;line-height:1.75;margin:0;color:#dcecf5}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.sidebar{position:sticky;top:16px;height:max-content}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.sidebar{padding:14px}.group{margin:14px 9px 6px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em}.sidebar button{width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:9px;cursor:pointer}.sidebar button:hover,.sidebar button.active{background:var(--soft);color:var(--blue);font-weight:750}.body{min-width:0}.module{margin-bottom:18px;padding:24px}.module-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:17px}.kicker{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--cyan)}h2{font-size:23px;margin:5px 0 0}.module-head p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px;border-radius:14px;background:linear-gradient(145deg,var(--soft),transparent);border:1px solid var(--line)}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.cross{margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}.cross h3{font-size:15px;margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 12px;cursor:pointer;font-size:12px}.chip:hover,.chip.active{border-color:var(--cyan);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 9%,var(--panel))}.chip small{opacity:.7;margin-left:5px}.timeline{position:relative;margin-left:8px;padding-left:28px}.timeline:before{content:"";position:absolute;left:7px;top:7px;bottom:8px;width:2px;background:linear-gradient(var(--blue),var(--cyan))}.phase{position:relative;padding:0 0 22px}.phase:last-child{padding-bottom:0}.phase:before{content:"";position:absolute;left:-27px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--panel);border:3px solid var(--cyan)}.phase time{font-size:11px;font-weight:800;color:var(--cyan)}.phase h3{font-size:17px;margin:4px 0}.phase p{margin:0;color:var(--muted);line-height:1.7;font-size:13px}.phase .support{margin-top:7px;color:var(--blue);font-size:11px}.trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.trend{padding:18px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(155deg,var(--panel),var(--soft))}.trend i{display:block;font-style:normal;font-size:11px;color:var(--cyan);font-weight:800}.trend h3{font-size:16px;line-height:1.45;margin:7px 0}.trend p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.trend button{margin-top:12px;border:0;background:transparent;color:var(--blue);padding:0;cursor:pointer;font-size:12px}.controls{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(120px,1fr));gap:9px;margin-bottom:12px}.controls input,.controls select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px;border-radius:10px}.resultbar{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin:12px 0}.papers{display:grid;gap:10px}.paper{padding:18px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px}.badge{background:var(--soft);color:var(--blue);border-radius:7px;padding:3px 7px}.paper h3{font-size:17px;line-height:1.45;margin:8px 0}.paper p{font-size:13px;line-height:1.65;color:var(--muted);margin:7px 0}.paper .links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:9px}.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 22px;border-radius:10px;cursor:pointer}.notice{margin-top:14px;padding:12px 15px;background:var(--warm);border-radius:11px;color:var(--muted);font-size:12px;line-height:1.65}.empty{text-align:center;color:var(--muted);padding:30px}.source{font-size:12px}.source a{text-decoration:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}.sidebar #topics{display:flex;flex-wrap:wrap}.sidebar button{width:auto}.trend-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:span 2}}@media(max-width:560px){.wrap{padding:12px}.hero,.module{padding:20px}.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.controls input{grid-column:auto}}
</style></head><body><div class="wrap">
<header class="top"><a href="./">← 研究门户</a><nav class="topnav"><a href="./library.html">全库检索</a><a href="./insights.html">趋势洞察</a><a href="https://github.com/zhho9493-tech/awesome-sound-detection">GitHub ↗</a></nav></header>
<section class="hero"><div class="eyebrow" id="dimension">RESEARCH DIRECTION</div><h1 id="heading">研究专题</h1><p id="heroText">以“研究方向 × 解决的问题”双维度组织论文；同一工作可以同时进入多个方向和问题专题。</p></section>
<div class="layout"><aside class="sidebar panel"><div id="topics">读取分类…</div></aside><main class="body">
<section class="module panel" id="overview"><div class="module-head"><div><div class="kicker">01 · 总览</div><h2 id="overviewTitle">专题全景</h2></div><div class="source" id="sourceLink"></div></div><div class="stats"><div class="stat"><b id="count">—</b><span>相关论文</span></div><div class="stat"><b id="years">—</b><span>覆盖年份</span></div><div class="stat"><b id="identified">—</b><span>有 DOI / arXiv 标识</span></div><div class="stat"><b id="pdfCount">—</b><span>有公开 PDF</span></div></div><div class="cross"><h3 id="crossTitle">该方向正在解决的问题</h3><div class="chips" id="crossChips"></div></div><div class="notice" id="note"></div></section>
<section class="module panel" id="timeline"><div class="module-head"><div><div class="kicker">02 · 技术时间线</div><h2>技术的发展与变化</h2></div><p>时间阶段与论文证据相互对应</p></div><div class="timeline" id="timelineBody"></div></section>
<section class="module panel" id="trends"><div class="module-head"><div><div class="kicker">03 · 技术趋势</div><h2>正在形成的技术迁移</h2></div><p>点击趋势可筛选支撑论文</p></div><div class="trend-grid" id="trendGrid"></div></section>
<section class="module panel" id="details"><div class="module-head"><div><div class="kicker">04 · 论文详情</div><h2>从最新到最旧</h2></div><p id="resultInfo"></p></div><div class="controls"><input id="q" placeholder="检索标题、摘要、作者…"><select id="crossFilter"><option value="">全部交叉维度</option></select><select id="year"><option value="">全部年份</option></select><select id="sort"><option value="new">最新优先</option><option value="old">最旧优先</option><option value="title">标题排序</option></select></div><div class="papers" id="papers"></div><button class="more" id="more" hidden>加载更多</button></section>
</main></div></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:(v?[v]:[]),fmt=n=>Number(n||0).toLocaleString('zh-CN');
let taxonomy={},rules={},content={},papers=[],topic='',dimension='applications',matches=[],filtered=[],shown=0,activeTrend='';const PAGE=30,repo='https://github.com/zhho9493-tech/awesome-sound-detection/blob/main/';
const groupNames={applications:'应用方向',methods:'方法与迁移方向',problems:'解决的问题'};
function text(r){return [r.title,r.abstract,...arr(r.categories),...arr(r.topics)].join(' ').toLowerCase()}
function belongs(r,id){const rule=rules[id];if(!rule)return false;if(rule.match==='exact-category')return arr(r.categories).some(c=>arr(rule.categories).includes(c));const t=text(r);return arr(rule.terms).some(k=>t.includes(k.toLowerCase()))}
function allItems(){return Object.entries(taxonomy).flatMap(([g,xs])=>xs.map(x=>({...x,group:g})))}
function itemFor(id){return allItems().find(x=>x.id===id)}
function crossItems(){return dimension==='problems'?[...arr(taxonomy.applications),...arr(taxonomy.methods)]:arr(taxonomy.problems)}
function matchesFor(id){return papers.filter(r=>belongs(r,id))}
function drawMenu(){const groups=['applications','methods','problems'];$('topics').innerHTML=groups.map(g=>'<div class="group">'+groupNames[g]+'</div>'+arr(taxonomy[g]).map(x=>'<button data-topic="'+esc(x.id)+'">'+esc(x.name)+'</button>').join('')).join('')}
function overlap(item){return matches.filter(r=>belongs(r,item.id)).length}
function renderCross(){const candidates=crossItems().map(x=>({...x,count:overlap(x)})).filter(x=>x.count).sort((a,b)=>b.count-a.count);$('crossTitle').textContent=dimension==='problems'?'该问题出现在哪些研究方向':'该方向内的论文正在解决哪些问题';$('crossChips').innerHTML=candidates.length?candidates.map(x=>'<button class="chip" data-cross="'+esc(x.id)+'">'+esc(x.name)+'<small>'+fmt(x.count)+'</small></button>').join(''):'<span class="meta">当前规则下尚无可确认的交叉标签</span>';$('crossFilter').innerHTML='<option value="">全部'+(dimension==='problems'?'方向':'问题')+'</option>'+candidates.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'（'+x.count+'）</option>').join('')}
function phaseSupport(index,total){if(!matches.length)return 0;const ys=matches.map(r=>Number(r.year)).filter(Boolean),min=Math.min(...ys),max=Math.max(...ys),span=Math.max(1,max-min+1),a=min+Math.floor(span*index/total),b=index===total-1?max:min+Math.floor(span*(index+1)/total)-1;return matches.filter(r=>Number(r.year)>=a&&Number(r.year)<=b).length}
function renderNarrative(){const cfg=content[topic]||{},base=content.default||{},timeline=cfg.timeline||base.timeline||[],trends=cfg.trends||base.trends||[];$('timelineBody').innerHTML=timeline.map((x,i)=>'<article class="phase"><time>'+esc(x.period)+'</time><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p><div class="support">'+fmt(phaseSupport(i,timeline.length))+' 篇同期论文形成阶段证据</div></article>').join('');$('trendGrid').innerHTML=trends.map((x,i)=>'<article class="trend"><i>趋势 '+String(i+1).padStart(2,'0')+'</i><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p><button data-trend="'+esc(x.title)+'">查看支撑论文 →</button></article>').join('')}
function trendTerms(title){const map={'开放词表':['open-vocabulary','open vocabulary','zero-shot','language model','text-audio','clap'],'时间与空间':['localization','separation','temporal','polyphonic','spatial'],'噪声':['noise','snr','robust'],'跨域':['domain','cross-domain'],'少样本':['few-shot','few shot','low-resource'],'预训练':['pretrain','foundation','self-supervised'],'未知':['open-set','ood','unknown','novelty'],'可靠性':['uncertainty','calibration','confidence','robust'],'弱监督':['weakly','semi-supervised','pseudo-label'],'持续':['continual','incremental','lifelong']};return Object.entries(map).filter(([k])=>title.includes(k)).flatMap(([,v])=>v)}
function renderPapers(){const q=$('q').value.trim().toLowerCase(),cross=$('crossFilter').value,y=$('year').value,sort=$('sort').value,tt=trendTerms(activeTrend);filtered=matches.filter(r=>(!cross||belongs(r,cross))&&(!y||r.year===y)&&(!q||[text(r),...arr(r.authors)].join(' ').toLowerCase().includes(q))&&(!activeTrend||!tt.length||tt.some(k=>text(r).includes(k))));filtered.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='old'?(a.published||a.year||'').localeCompare(b.published||b.year||''):(b.published||b.year||'').localeCompare(a.published||a.year||''));shown=0;$('papers').replaceChildren();$('resultInfo').textContent=fmt(filtered.length)+' 篇'+(activeTrend?' · 趋势筛选：'+activeTrend:'');more()}
function safe(u){return /^https:\/\/(?:arxiv\.org|doi\.org|openreview\.net)\//.test(u||'')?u:''}
function more(){const slice=filtered.slice(shown,shown+PAGE);$('papers').insertAdjacentHTML('beforeend',slice.map(r=>{const u=safe(r.url),pdf=safe(r.pdf_url),tags=crossItems().filter(x=>belongs(r,x.id)).slice(0,5);return '<article class="paper card"><div class="meta"><span class="badge">'+esc(r.published||r.year||'日期待核验')+'</span><span>'+esc(arr(r.authors).slice(0,5).join('、')||'作者待补充')+'</span></div><h3>'+esc(r.title)+'</h3><p>'+esc((r.abstract||'当前索引未提供摘要。').slice(0,360))+'</p><div class="chips">'+tags.map(x=>'<span class="badge">'+esc(x.name)+'</span>').join('')+'</div><div class="links">'+(u?'<a href="'+u+'" target="_blank" rel="noopener">论文主页 ↗</a>':'')+(pdf?'<a href="'+pdf+'" target="_blank" rel="noopener">公开 PDF ↗</a>':'')+'<span>标识：'+esc(r.arxiv_id||r.doi||'待核验')+'</span></div></article>'}).join(''));shown+=slice.length;$('more').hidden=shown>=filtered.length;if(!filtered.length)$('papers').innerHTML='<div class="empty">没有符合当前筛选条件的论文</div>'}
function selectTopic(id){const item=itemFor(id);if(!item||!rules[id])return;topic=id;dimension=item.group;matches=matchesFor(id);activeTrend='';history.replaceState(null,'','?topic='+encodeURIComponent(id));$('dimension').textContent=dimension==='problems'?'PROBLEM · 解决的问题':'DIRECTION · 研究方向';$('heading').textContent=item.name;$('heroText').textContent=item.summary||'以研究方向和解决的问题两个维度交叉组织论文。';$('overviewTitle').textContent=item.name+' · 专题总览';$('sourceLink').innerHTML='<a href="'+repo+encodeURI(item.path)+'" target="_blank" rel="noopener">人工专题资料 ↗</a>';$('count').textContent=fmt(matches.length);const ys=matches.map(r=>Number(r.year)).filter(Boolean);$('years').textContent=ys.length?Math.min(...ys)+'–'+Math.max(...ys):'待补充';$('identified').textContent=fmt(matches.filter(r=>r.arxiv_id||r.doi).length);$('pdfCount').textContent=fmt(matches.filter(r=>safe(r.pdf_url)).length);$('note').innerHTML=rules[id].match==='exact-category'?'方向归属来自仓库已有分类；问题维度在标题与摘要上独立匹配，因此论文可以跨方向、跨问题重复出现。':'该专题按标题与摘要中的问题证据归类，属于可复核候选；论文可与多个方向及问题专题交叠。';document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('active',b.dataset.topic===id));renderCross();renderNarrative();$('year').innerHTML='<option value="">全部年份</option>'+[...new Set(matches.map(r=>r.year).filter(Boolean))].sort().reverse().map(y=>'<option>'+esc(y)+'</option>').join('');$('q').value='';renderPapers()}
async function init(){const [t,r,c,p]=await Promise.all([fetch('../resources/research-taxonomy.json').then(x=>x.json()),fetch('../resources/topic-paper-rules.json').then(x=>x.json()),fetch('../resources/topic-page-content.json').then(x=>x.json()),fetch('./data/papers.json').then(x=>x.json())]);taxonomy=t.dimensions;rules=r.topics;content=c;papers=p.records||[];drawMenu();selectTopic(new URLSearchParams(location.search).get('topic')||'sed')}
$('topics').addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(b)selectTopic(b.dataset.topic)});$('crossChips').addEventListener('click',e=>{const b=e.target.closest('[data-cross]');if(!b)return;$('crossFilter').value=b.dataset.cross;document.querySelectorAll('[data-cross]').forEach(x=>x.classList.toggle('active',x===b));renderPapers();location.hash='details'});$('trendGrid').addEventListener('click',e=>{const b=e.target.closest('[data-trend]');if(!b)return;activeTrend=activeTrend===b.dataset.trend?'':b.dataset.trend;renderPapers();location.hash='details'});['q','crossFilter','year','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',renderPapers));$('more').addEventListener('click',more);init().catch(e=>{$('topics').textContent='加载失败';$('note').textContent='请通过本地预览服务或 GitHub Pages 打开：'+e.message});
</script></body></html>
